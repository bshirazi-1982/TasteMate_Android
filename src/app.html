<title>Tastemate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F7F3FB; --surface:#FFFFFF; --surface-2:#EFE8F6; --ink:#1F1430; --muted:#645776; --line:#E0D6EA;
  --accent:#5B21B6; --accent-ink:#FFFFFF; --offer:#D7263D; --offer-ink:#FFFFFF; --star:#F2B705; --sun:#FFD23F;
  --good:#2A8455; --warn:#A15C00; --bad:#B3261E;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#130C1D; --surface:#1D1429; --surface-2:#291D38; --ink:#F2ECF8; --muted:#AA9CBC; --line:#3A2C4C;
    --accent:#B99BFF; --accent-ink:#1A0B33; --offer:#FF5C6E; --offer-ink:#2A0409; --star:#FFCC33; --sun:#FFD23F;
    --good:#5CC98A; --warn:#F2B35A; --bad:#FF7A70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#130C1D; --surface:#1D1429; --surface-2:#291D38; --ink:#F2ECF8; --muted:#AA9CBC; --line:#3A2C4C;
  --accent:#B99BFF; --accent-ink:#1A0B33; --offer:#FF5C6E; --offer-ink:#2A0409; --star:#FFCC33; --sun:#FFD23F;
  --good:#5CC98A; --warn:#F2B35A; --bad:#FF7A70;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
.app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:calc(18px + var(--safe-area-inset-top, 0px)) calc(48px + var(--safe-area-inset-bottom, 0px))}
.gmap-slot{width:100%;height:min(62vh,540px);min-height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:grid}
.gmap-slot > .gmap{width:100%;height:100%}
.gmap-loading{place-self:center;color:var(--muted);font-size:.9rem}
.pin{display:grid;place-items:center;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font:600 11px var(--mono);color:#fff;position:relative;cursor:pointer}
.pin.sel{outline:3px solid var(--ink);outline-offset:2px}
.pin-label{position:absolute;left:calc(100% + 6px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--surface);color:var(--ink);font:700 12px var(--body);padding:3px 8px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.youpin{width:16px;height:16px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(26,115,232,.25)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.3rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600;font-family:var(--body)}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#5B21B6 0%,#5B21B6 55%,#D7263D 100%);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.brand p{color:var(--muted);font-size:.9rem}
.loc{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;overflow-x:auto;margin-block:18px 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:600 .94rem var(--body);color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .badge{display:inline-block;margin-left:6px;background:var(--offer);color:var(--offer-ink);border-radius:999px;font-size:.7rem;padding:0 7px}

.stack{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font:600 .88rem var(--body);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--surface-2);padding:2px 9px;font-size:.78rem;font-weight:600;color:var(--ink);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--sun) 45%,var(--surface));color:var(--ink)}
.chip.offer{background:var(--offer);color:var(--offer-ink)}
.chip.accent{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:var(--accent)}
.stars{color:var(--star);letter-spacing:1px;white-space:nowrap;text-shadow:0 0 1px color-mix(in srgb,var(--ink) 35%,transparent)}
.stars .off{color:var(--line)}

.summary{display:flex;flex-wrap:wrap;gap:10px 28px}
.summary div b{display:block;font:800 1.6rem var(--display)}
.summary div span{color:var(--muted);font-size:.84rem}

.sources{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.source{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start;background:var(--surface)}
.source .status{font-size:.85rem}
.source details{font-size:.86rem;color:var(--muted)}
.source summary{cursor:pointer;color:var(--ink);font-weight:600}
.source ol{padding-left:18px;margin:8px 0 0;display:grid;gap:4px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;font-size:.9rem}
.toast{border-radius:10px;padding:10px 14px;font-size:.92rem;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,var(--surface))}
.toast.err{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,var(--surface))}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.cell{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:6px;font-family:var(--mono);font-size:.84rem}
.cell.none{color:var(--line)}
.matrix td:first-child{min-width:170px}
.matrix th.u{min-width:62px;text-align:center}

.rec{display:grid;gap:10px;align-content:start;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface)}
.rec .score{font:800 1.5rem var(--display);color:var(--accent)}
.rec .why{font-size:.85rem;color:var(--muted)}
.offerbox{border:1.5px solid var(--offer);background:color-mix(in srgb,var(--offer) 7%,var(--surface));border-radius:10px;padding:8px 10px;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.offerdeal{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chooser{display:grid;gap:10px;border:1.5px solid var(--accent);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.choice{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.choice > div{flex:1 1 200px}
.pricefields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.pricefields label{display:grid;gap:4px;font-size:.85rem;font-weight:600}
.leaflet-container{font:inherit;background:var(--surface-2)}
.leaflet-div-icon,.leaflet-marker-icon{background:none;border:0}
.rec.hasoffer{border-color:var(--offer);box-shadow:0 0 0 1px var(--offer)}
.rec .dist{font:800 1.25rem var(--display);color:var(--accent)}
.kindprog{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.kindprog div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.kindprog div.ok{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.kindprog b{font:800 1.3rem var(--display)}

.seg button{white-space:nowrap}

.mapgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:860px){.mapgrid{grid-template-columns:1fr}}
.map{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.map g[data-venue]{cursor:pointer}
.map g[data-venue]:focus{outline:none}
.map g[data-venue]:focus circle.dot{stroke:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.detail{display:grid;gap:12px;align-content:start}
.linklist{display:grid;gap:8px}

.users{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.user{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.ratelist{display:grid;gap:8px}
.raterow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.starinput{display:flex;gap:2px}
.starinput button{background:none;border:0;font-size:1.35rem;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.starinput button.on{color:var(--star);text-shadow:0 0 1px color-mix(in srgb,var(--ink) 40%,transparent)}

.offer{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.offer.live{border-color:var(--offer);box-shadow:0 0 0 1px var(--offer)}
.offer .deal{font:800 1.25rem var(--display)}
.timer{font-family:var(--mono);color:var(--offer);font-weight:500}
.voucher{font-family:var(--mono);font-size:1.1rem;letter-spacing:.08em;background:var(--surface-2);border-radius:8px;padding:8px 12px;text-align:center}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--offer)}

form.venueform{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
form.venueform label{display:grid;gap:4px;font-size:.85rem;font-weight:600}
.reach{border-radius:12px;padding:14px;background:var(--surface-2)}
.reach b.big{font:800 2rem var(--display);color:var(--accent)}
footer{margin-top:28px;color:var(--muted);font-size:.8rem}
.topright{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
#acct{gap:8px}
.btn.big{padding:11px 18px;font-size:.98rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font:600 .86rem var(--body);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.authwrap{max-width:520px;margin:0 auto}
.field{display:grid;gap:5px;font-size:.88rem;font-weight:600}
.field input,.field select{font-weight:400;padding:10px 12px}
.roles{border:0;padding:0;margin:0;display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:480px){.roles{grid-template-columns:1fr}}
.roles legend{margin-bottom:8px}
.rolecard{display:grid;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.rolecard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.rolecard input{position:absolute;opacity:0;pointer-events:none}
.rolecard:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px;align-content:start}
.tile .tl{font-size:.78rem;color:var(--muted);font-weight:600}
.tile b{font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.liverow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}
.liverow:first-of-type{border-top:0;padding-top:0}
.costline{font-size:.92rem}
.qrwrap{display:grid;justify-items:center;gap:8px}
.qr{background:#fff;padding:8px;border-radius:10px;max-width:100%}
.qr svg{display:block;width:100%;height:auto}
.qr svg rect[fill="white"],.qr svg rect[fill="#ffffff"]{fill:#fff}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;max-width:420px;aspect-ratio:1/1;width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanhint{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-weight:600;font-size:.9rem}
.barchart{overflow:hidden}
.vbars{display:grid;gap:3px;height:170px;align-items:stretch;border-bottom:1px solid var(--line)}
.vbar{position:relative;display:grid;grid-template-rows:1fr 18px;outline:none}
.vbar .col{display:flex;align-items:flex-end}
.vbar .col i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0}
.vbar:hover .col i,.vbar:focus .col i{background:color-mix(in srgb,var(--accent) 75%,var(--ink))}
.vbar span{font-size:.68rem;color:var(--muted);text-align:center;line-height:18px;white-space:nowrap}
.vbar[data-tip]:hover::after,.vbar[data-tip]:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% - 10px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:6px;font-size:.76rem;white-space:nowrap;z-index:5;pointer-events:none}
.vbar:first-child[data-tip]:hover::after,.vbar:first-child[data-tip]:focus::after{left:0;transform:none}
.vbar:last-child[data-tip]:hover::after,.vbar:last-child[data-tip]:focus::after{left:auto;right:0;transform:none}
.barchart{overflow:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</div>

function cleanErr(m){
  m = String(m || 'Something went wrong. Try again.').replace(/^Error:\s*/, '');
  if (/Invalid login credentials/i.test(m)) return 'Email or password is wrong.';
  if (/already registered|already been registered/i.test(m)) return 'An account with this email already exists. Sign in instead.';
  if (/Email not confirmed/i.test(m)) return 'Confirm your email first. Open the link in the email from Tastemate, then sign in.';
  if (/Password should be at least/i.test(m)) return 'Use a password of at least 8 characters.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No connection. Check your internet and try again.';
  return m;
}

function SupaApi(){

    const {data:{session}} = await sb.auth.getSession();
    if (!session) { uid = null; return null; }
    uid = session.user.id;
    const prof = chk(await sb.from('profiles').select('*').eq('id', uid).maybeSingle());
    if (!prof) return null;
    const vendor = prof.role === 'vendor' ? chk(await sb.from('vendors').select('*').eq('id', uid).maybeSingle()) : null;

  }

    demo:false, account,
    async signUp(f){
      const {data, error} = await sb.auth.signUp({email:f.email, password:f.password, options:{emailRedirectTo:CFG.APP_URL || undefined,

      return data.session ? account() : {confirm:true};
    },

    async signOut(){ await sb.auth.signOut(); uid = null; },

    async updatePassword(pw){ chk(await sb.auth.updateUser({password:pw})); },
    onRecovery(cb){ sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') cb(); }); },
    async liveOffers(){ return chk(await sb.rpc('live_offers')); },
    async claim(id, mode){ return chk(await sb.rpc('claim_offer', {p_offer:id, p_mode:mode || 'free'})); },
    async payVoucher(voucherId){
      const {data, error} = await sb.functions.invoke('create-voucher-checkout', {body:{voucher_id:voucherId, return_url:(CFG.APP_URL || location.href.split('#')[0])}});
      if (error) { let m = error.message; try { const j = await error.context.json(); m = j.error || m; } catch(e) {} throw new Error(cleanErr(m)); }

/* ---------- Matching engine ---------- */
const SOURCES = {google:'Google', tripadvisor:'Tripadvisor', yelp:'Yelp', other:'File', manual:'Tastemate', example:'Example'};
function myRatings(){
  const out = {};
  for (const [vid, src] of Object.entries(S.mine)) {
    const vals = Object.values(src).filter(n => typeof n === 'number');
    if (vals.length) out[vid] = vals.reduce((a,b)=>a+b,0)/vals.length;
  }
  return out;
}
function sim(a, b){
  let n = 0, agree = 0;
  for (const k in a) if (b[k] != null) { n++; agree += Math.max(0, 1 - Math.abs(a[k]-b[k])/2); }
  return n ? {pct:Math.round(agree/n*100), n} : {pct:0, n:0};
}
// Matching is done separately for each category: restaurants against restaurant ratings, bars against bars, and so on.
const kindOf = id => venue(id)?.kind;
function ofKind(r, kind){ const o = {}; for (const k in r) if (kindOf(k) === kind) o[k] = r[k]; return o; }
const meanOf = r => { const v = Object.values(r); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : 4; };
function kmean(u, kind){

  if (u.km[kind] == null) { const v = Object.values(ofKind(u.ratings, kind)); u.km[kind] = v.length ? v.reduce((a,b)=>a+b,0)/v.length : (u.mean ?? meanOf(u.ratings)); }
  return u.km[kind];

    .filter(x => x.n >= 2)
    .map(x => ({...x, score: x.pct * x.n/(x.n+2)}))
    .sort((a,b) => b.score - a.score).slice(0, 10);

        <div class="row"><span class="chip accent">For you ${p.val.toFixed(1)}★</span><span class="chip">${p.count}/10 ${esc(KINDS[v.kind].toLowerCase())} matches · avg ${p.avg.toFixed(1)}★</span>${v.g ? `<span class="chip">Google ${v.g.toFixed(1)}★</span>` : ''}</div>

function viewMatches(){
  const mr = myRatings();
  const counts = Object.fromEntries(KIND_ORDER.map(k => [k, Object.keys(ofKind(mr, k)).length]));
  const kind = KINDS[S.matchKind] ? S.matchKind : KIND_ORDER.slice().sort((a,b) => counts[b] - counts[a])[0];

  if (!nb.length) return `<div class="stack">${kindBar}<section class="panel stack"><h2>No ${label} matches yet</h2><p class="muted">Matches for ${label} only compare ratings of ${label}. Rate at least two that other people have rated.</p><div><button class="btn primary" data-act="rate-kind" data-kind="${kind}">Rate ${label}</button></div></section></div>`;
  const vids = S.venues.filter(v => v.kind === kind && (mr[v.id] != null || nb.some(x => x.u.ratings[v.id] != null))).map(v => {
    const rs = nb.map(x => x.u.ratings[v.id]).filter(r => r != null);
    return {v, count:rs.length, avg:rs.length ? rs.reduce((a,b)=>a+b,0)/rs.length : null};
  }).sort((a,b) => b.count - a.count || (b.avg||0) - (a.avg||0));
  const cell = r => r == null ? `<span class="cell none">–</span>` : `<span class="cell" style="${cellBg(r)}">${Number.isInteger(r) ? r : r.toFixed(1)}</span>`;
  const {list} = mapPoints(v => vids.some(x => x.v.id === v.id && x.count));
  const pts = list.map(v => { const x = vids.find(y => y.v.id === v.id); return {...v, r: 6 + x.count*1.4, inner: x.count, fill:`color-mix(in srgb, var(--accent) ${35 + ((x.avg||1)-1)*16}%, var(--muted))`}; });
  const sel = venue(S.cmpSel)?.kind === kind ? venue(S.cmpSel) : null, selRow = sel && vids.find(x => x.v.id === sel.id);
  return `<div class="stack">
    ${kindBar}
    <section class="panel stack">
      <div class="head"><div><p class="eyebrow">Match = how closely your stars agree on ${label} you've both rated · more shared places ranks higher</p><h2>Your 10 closest matches for ${label}</h2></div><span class="small muted">Out of ${POOL.length} profiles</span></div>
      <div class="users">${nb.map(x => `<div class="user"><b>${esc(x.u.name)}</b><span class="small muted">${esc(x.u.arch)}</span><div class="row" style="justify-content:space-between"><span class="num" style="font-size:1.2rem;color:var(--accent)">${x.pct}%</span><span class="small muted">${x.n} shared</span></div><div class="bar"><i style="width:${x.pct}%"></i></div></div>`).join('')}</div>
    </section>
    <section class="panel stack">
      <div class="head"><h2>Side-by-side ratings</h2><span class="small muted">Darker cells are higher ratings</span></div>
      <div class="tablewrap"><table class="matrix">
        <thead><tr><th>Place</th><th class="u">You</th>${nb.map(x => `<th class="u">${esc(x.u.name.split(' ')[0])}<br><span class="num">${x.pct}%</span></th>`).join('')}<th class="c">Rated by</th><th class="c">Matches avg</th><th class="c">Google</th><th></th></tr></thead>
        <tbody>${vids.map(({v,count,avg}) => `<tr>
          <td><b>${esc(v.name)}</b><div class="small muted">${esc(v.cat)}</div></td>
          <td class="c">${cell(mr[v.id] ?? null)}</td>
          ${nb.map(x => `<td class="c">${cell(x.u.ratings[v.id] ?? null)}</td>`).join('')}
          <td class="c num">${count}/10</td><td class="c num">${avg != null ? avg.toFixed(1) : '–'}</td><td class="c num muted">${v.g ? v.g.toFixed(1) : '–'}</td>
          <td>${hasCoords(v) ? `<button class="btn" data-cmp="${v.id}">Map</button>` : ''}</td></tr>`).join('')}</tbody></table></div>
    </section>
    <section class="panel stack">
      <div class="head"><div><p class="eyebrow">Number in each pin = how many of your top 10 rated it · darker = higher average</p><h2>Where your ${label} matches have been</h2></div></div>
      <div class="mapgrid">
        <div>${pts.length ? mapSlot('cmp', pts, {selId:sel?.id, attr:'cmp'}) : '<p class="muted">No mapped places yet.</p>'}</div>
        <aside class="detail">${sel && selRow ? `
          <div><h3>${esc(sel.name)}</h3><p class="muted small">${selRow.count} of 10 rated it · matches average ${selRow.avg?.toFixed(1) ?? '–'}★${sel.g ? ` · Google ${sel.g.toFixed(1)}★` : ''}</p></div>
          <div class="tablewrap"><table><tbody>

            ${nb.filter(x => x.u.ratings[sel.id] != null).map(x => `<tr><td>${esc(x.u.name)} <span class="muted num small">${x.pct}%</span></td><td>${stars(x.u.ratings[sel.id])}</td></tr>`).join('')}
          </tbody></table></div>${linkButtons(sel, true)}`
          : `<h3>Tap a pin</h3><p class="muted small">See every rating your matches gave that place, side by side with yours.</p>`}</aside>
      </div>
    </section>
  </div>`;
}

/* ---------- Rating: only places within 500 m are listed; everything else is found by search ---------- */
const NEAR_KM = 0.5;
function rateRow(v){
  const manual = S.mine[v.id]?.manual, others = Object.entries(S.mine[v.id]||{}).filter(([k]) => k !== 'manual'), d = distTo(v);

      ${others.length ? `<div class="row" style="margin-top:4px">${others.map(([k,n]) => `<span class="chip">${SOURCES[k]||k} ${n}★</span>`).join('')}</div>` : ''}</div>
    <div class="starinput" role="group" aria-label="Rate ${esc(v.name)}">${[1,2,3,4,5].map(n => `<button class="${manual >= n ? 'on' : ''}" data-rate="${n}" data-vid="${v.id}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}</div>
  </div>`;
}
function searchResultsHtml(){
  const q = (S.rateQ || '').trim().toLowerCase();
  if (q.length < 2) return liveProvider() ? `<p class="small muted">Type a name, a street or a kind of place (e.g. “sushi”). Results come live from ${providerName()}.</p>` : '';
  const inKind = v => S.kind === 'all' || v.kind === S.kind;
  const live = (S.liveIds || []).map(venue).filter(v => v && inKind(v));
  const ids = new Set(live.map(v => v.id));
  const local = S.venues.filter(v => !ids.has(v.id) && inKind(v) && (v.name + ' ' + v.cat + ' ' + (v.area || '') + ' ' + (KINDS[v.kind] || '')).toLowerCase().includes(q))
    .sort((a, b) => (distTo(a) ?? 1e9) - (distTo(b) ?? 1e9)).slice(0, 12);
  const all = live.concat(local);
  return `<div class="stack">
    ${S.searching ? `<p class="small muted">Searching ${providerName()}…</p>` : ''}
    ${S.searchErr ? `<p class="small" style="color:var(--bad)">${esc(S.searchErr)}</p>` : ''}
    ${all.length ? `<div class="ratelist">${all.map(rateRow).join('')}</div>` : S.searching ? '' : `<p class="muted small">No places match “${esc(S.rateQ)}”${S.kind === 'all' ? '' : ' in ' + esc(KINDS[S.kind].toLowerCase())}.</p>`}
    ${live.length ? `<p class="small muted">Results from ${providerName()}. Places you rate are saved on this device.</p>` : ''}
  </div>`;
}

  const near = S.venues.filter(v => inKind(v) && mr[v.id] == null && hasCoords(v) && km(me(), v) <= NEAR_KM).sort((a,b) => km(me(), a) - km(me(), b));

  return `<div class="stack">

    </section>

    <section class="panel stack">
      <form id="placeSearch" class="row" role="search"><input id="rateSearch" type="search" autocomplete="off" placeholder="${liveProvider() ? 'Search any restaurant, bar, museum, theatre or shop' : 'Search for a place to rate'}" aria-label="Search for a place" value="${esc(S.rateQ || '')}" style="flex:1 1 220px"><button class="btn primary" type="submit">Search</button></form>
      <div id="searchResults">${searchResultsHtml()}</div>

    <section class="stack">

      ${nearbyStatus(S.kind) === 'loading' ? `<p class="small muted">Finding places near you…</p>` : ''}

      ${near.length ? `<div class="ratelist">${near.map(rateRow).join('')}</div>` : nearbyStatus(S.kind) === 'loading' ? '' : `<p class="note">Nothing${S.kind === 'all' ? '' : ' in ' + esc(KINDS[S.kind].toLowerCase())} left to rate within 500 m. Search above for places further away.</p>`}
    </section>
    ${rated.length ? `<section class="stack"><div class="head"><h2>Your ratings</h2><span class="small muted num">${rated.length}</span></div><div class="ratelist">${rated.map(rateRow).join('')}</div></section>` : ''}
  </div>`;
}
const kindFromType = t => {
  t = String(t || '');
  if (/theater|theatre|comedy|concert|performing|opera|cabaret/.test(t)) return 'Theatre';
  if (/bar|pub|night_club|wine|cocktail|brewery/.test(t)) return 'Drink';
  if (/museum|gallery|art|historical|monument/.test(t)) return 'Culture';
  if (/store|shop|market|book/.test(t)) return 'Shop';
  if (/restaurant|food|cafe|bakery|meal|diner|brunch|coffee|steak_house|pizza|sushi/.test(t)) return 'Eat';
  return 'Place';
};

/* ---------- Offers and vouchers (diners) ---------- */

  return `<div class="qrwrap">${svg ? `<div class="qr" style="width:${px}px">${svg}</div>` : ''}<div class="voucher" aria-label="Voucher code">${esc(code)}</div></div>`;

const isLiveOffer = o => !o.cancelled_at && Date.parse(o.expires_at) > Date.now();
function computeStats(d, days){
  const since = days ? Date.now() - days*864e5 : 0;
  const offers = d.offers.filter(o => Date.parse(o.created_at) >= since);
  const ids = new Set(offers.map(o => o.id));
  const vs = d.vouchers.filter(v => ids.has(v.offer_id) && (v.status || 'active') === 'active'), red = vs.filter(v => v.redeemed_at);
  const byKind = {ticket:{claimed:0, redeemed:0, paid:0}, secured:{claimed:0, redeemed:0, paid:0}, free:{claimed:0, redeemed:0, paid:0}};
  vs.forEach(v => { const k = byKind[v.kind || 'free']; k.claimed++; if (v.redeemed_at) k.redeemed++; k.paid += v.paid_pence || 0; });
  const billed = red.filter(v => v.bill_pence != null), parties = red.filter(v => v.party_size);
  const buys = d.ledger.filter(l => l.kind === 'purchase' && l.amount_pence);
  const boughtQty = buys.reduce((s, l) => s + l.paid_delta, 0);
  const avgUnit = boughtQty ? buys.reduce((s, l) => s + l.amount_pence, 0) / boughtQty : 0;
  const issued = offers.reduce((s, o) => s + o.tokens, 0), paidUsed = offers.reduce((s, o) => s + (o.paid_tokens || 0), 0), freeUsed = offers.reduce((s, o) => s + (o.free_tokens || 0), 0);
  const revenue = billed.reduce((s, v) => s + v.bill_pence, 0), cost = paidUsed * avgUnit;
  const byHour = Array.from({length:24}, () => ({n:0, rev:0})), byDow = Array.from({length:7}, () => ({n:0, rev:0}));
  red.forEach(v => { const t = new Date(v.redeemed_at); const h = byHour[t.getHours()], w = byDow[(t.getDay() + 6) % 7]; h.n++; w.n++; h.rev += v.bill_pence || 0; w.rev += v.bill_pence || 0; });
  const offerOf = Object.fromEntries(offers.map(o => [o.id, o]));
  const byType = {};
  offers.forEach(o => { const t = byType[o.offer_type] ??= {offers:0, tokens:0, claimed:0, redeemed:0, rev:0, billed:0}; t.offers++; t.tokens += o.tokens; });
  vs.forEach(v => { const t = byType[offerOf[v.offer_id].offer_type]; t.claimed++; if (v.redeemed_at) { t.redeemed++; if (v.bill_pence != null) { t.rev += v.bill_pence; t.billed++; } } });
  const perOffer = offers.map(o => { const ov = vs.filter(v => v.offer_id === o.id), orr = ov.filter(v => v.redeemed_at);
    return {o, claimed:ov.length, redeemed:orr.length, rev:orr.reduce((s, v) => s + (v.bill_pence || 0), 0)}; });
  const waits = red.map(v => (Date.parse(v.redeemed_at) - Date.parse(v.claimed_at)) / 60000).filter(x => x >= 0).sort((a, b) => a - b);
  const q = p => waits.length ? waits[Math.min(waits.length - 1, Math.floor(p*waits.length))] : null;
  const busiest = byHour.reduce((b, h, i) => h.n > b.n ? {n:h.n, i} : b, {n:0, i:-1});
  return {byKind, offers, issued, claimed:vs.length, redeemed:red.length, revenue, avgBill:billed.length ? revenue/billed.length : null,
    avgParty:parties.length ? parties.reduce((s, v) => s + v.party_size, 0)/parties.length : null, paidUsed, freeUsed, cost, avgUnit,
    byHour, byDow, byType, perOffer, waitMed:q(.5), waitP75:q(.75), busiest};
}
const pct = (a, b) => b ? Math.round(a/b*100) + '%' : '–';
function tile(label, value, sub){ return `<div class="tile"><span class="tl">${label}</span><b class="num">${value}</b>${sub ? `<span class="small muted">${sub}</span>` : ''}</div>`; }
function bars(data, labels, tip, every = 1, desc = ''){
  const max = Math.max(1, ...data.map(d => d.n));
  return `<div class="barchart"><div class="vbars" style="grid-template-columns:repeat(${data.length},minmax(0,1fr))" role="img" aria-label="${esc(desc + ': ' + data.map((d, i) => labels[i] + ' ' + d.n).join(', '))}">

}

let scanStream = null, scanTimer = null;
function stopScan(){
  if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  const box = $('#scanBox'); if (box) box.hidden = true;
  const a = $('#scanStart'), b = $('#scanStop'); if (a) a.hidden = false; if (b) b.hidden = true;
}
async function startScan(){
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
  } catch(e) { S.scanResult = {ok:false, msg:'Camera access was refused. Allow the camera for Tastemate in your settings, or type the code.'}; render(); return; }
  const video = $('#scanVideo'), box = $('#scanBox');
  box.hidden = false; $('#scanStart').hidden = true; $('#scanStop').hidden = false;
  video.srcObject = scanStream; await video.play().catch(() => {});
  const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', {willReadFrequently:true});
  scanTimer = setInterval(() => {
    if (!video.videoWidth) return;
    const scale = Math.min(1, 640 / video.videoWidth);
    canvas.width = Math.round(video.videoWidth*scale); canvas.height = Math.round(video.videoHeight*scale);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const hit = window.jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
    const m = hit && String(hit.data).toUpperCase().match(/TM-[A-Z0-9]{6,}/);
    if (m) {
      stopScan();
      $('#r-code').value = m[0];
      if (navigator.vibrate) navigator.vibrate(60);
      $('#r-bill').focus();
    }
  }, 180);
}

function reachFor(vid, radius, minPred){
  const v = venue(vid); let rated = 0, predicted = 0, nearby = 0;
  POOL.forEach(u => {
    if (u.lat != null && km(u, v) > radius) return;
    nearby++;
    if ((u.ratings[vid] ?? 0) >= 4) rated++;
    else if (u.ratings[vid] == null) { const p = predictForUser(u, vid); if (p && p.val >= minPred) predicted++; }
  });
  return {rated, predicted, nearby, total: rated + predicted};
}

  }
  const nReady = (S.vouchers || []).filter(v => !v.redeemed_at && !v.cancelled_at && Date.parse(v.expires_at) > Date.now()).length;
  $('#tabs').innerHTML = tabs.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}">${l}${k === 'offers' && nOffers ? `<span class="badge">${nOffers}</span>` : ''}${k === 'vouchers' && nReady ? `<span class="badge">${nReady}</span>` : ''}</button>`).join('');
  const roleLabel = {user:'Diner', vendor:'Business', admin:'Publisher'}[role];
  $('#acct').innerHTML = S.acct ? `<span class="chip accent">${roleLabel}</span><button class="linkbtn small" data-act="account">${esc(S.acct.vendor?.business_name || S.acct.name || S.acct.email)}</button><button class="btn" data-act="signout">Sign out</button>`
    : `<button class="btn primary" data-act="to-auth">Sign in</button>`;
  $('.loc').hidden = role === 'vendor' || role === 'admin';
  $('#foot').textContent = API.demo
    ? 'Demo mode: accounts, offers, scans and payments are simulated on this device. Places and average ratings are from Google Maps (23 Sep 2026). The 50 comparison users are simulated.'
    : 'Places and average ratings are from Google Maps (23 Sep 2026). Recommendations use Tastemate members plus 50 simulated profiles while the community grows.';
  PENDING = [];
  $('#view').innerHTML = S.booting ? '<p class="muted">Loading…</p>' : VIEWS[S.tab]();
  if (S.toast && S.tab !== 'reviews' && S.tab !== 'auth') $('#view').insertAdjacentHTML('afterbegin', `<div class="toast ${S.toast.err ? 'err' : ''}" role="status" style="margin-bottom:14px">${S.toast.msg}</div>`);
  PENDING.forEach(mountMap);
  if (S.tab === 'map' && S.sel) fetchLiveRating(venue(S.sel));
  if (S.tab === 'rate') loadNearby(me(), S.kind, 700, () => { if (S.tab === 'rate') { const y = window.scrollY; render(); window.scrollTo({top:y}); } });
  if (S.tab === 'discover') loadNearby(me(), 'all', 1500, () => { if (S.tab === 'discover') render(); });
  $('#locSel').value = S.locKey;
  if (S.tab === 'v-offers') updateOfferForm();
  if (S.tab === 'v-tokens') updateBuyPrice();
  tick();
}
function tick(){
  document.querySelectorAll('[data-exp]').forEach(el => {
    const ms = +el.dataset.exp - Date.now();
    if (ms <= 0) { el.textContent = 'Ended'; return; }
    const h = Math.floor(ms/3600000), m = Math.floor(ms/60000)%60, s = Math.floor(ms/1000)%60;
    el.textContent = (h ? h+'h ' : '') + String(m).padStart(h?2:1,'0') + 'm ' + String(s).padStart(2,'0') + 's left';
  });
}
setInterval(tick, 1000);
const go = (tab) => { S.tab = tab; S.toast = null; S.delArm = false; S.resetArm = false; S.endArm = null; S.scanResult = null; save(); render(); window.scrollTo({top:0}); };
async function busy(t, fn){
  if (t) t.disabled = true;
  try { await fn(); }
  catch(err) { S.toast = {err:true, msg:esc(cleanErr(err.message))}; render(); }
  finally { if (t && document.body.contains(t)) t.disabled = false; }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-tab],[data-venue],[data-cmp],[data-rate],[data-act]');
  if (!t) return;
  if (t.dataset.tab) { go(t.dataset.tab); return; }
  if (t.dataset.rate) {
    const vid = t.dataset.vid, n = +t.dataset.rate;
    const rv = venue(vid); if (rv && rv.live) rv.imported = true;
    S.mine[vid] ??= {};
    if (S.mine[vid].manual === n) delete S.mine[vid].manual; else S.mine[vid].manual = n;
    if (!Object.keys(S.mine[vid]).length) delete S.mine[vid];
    save();
    const y = window.scrollY;
    render();
    window.scrollTo({top:y});
    return;
  }
  if (t.dataset.venue) { S.sel = t.dataset.venue; if (t.dataset.goto) S.tab = 'map'; render(); return; }
  if (t.dataset.cmp) { S.cmpSel = t.dataset.cmp; render(); return; }
  const act = t.dataset.act;
  if (act === 'sample-google') { const recs = extract(sampleGoogleExport()); reportImport(mergeRecords(recs, 'google', 'Sample export'), 'Google', 'the sample'); render(); }
  if (act === 'paste') {
    const recs = parsePaste($('#pasteBox').value), src = $('#pasteSrc').value;
    if (!recs.length) S.toast = {err:true, msg:'No ratings found. Put one place per line with its rating at the end, like “Hanok Table, 5”.'};
    else reportImport(mergeRecords(recs, src, 'Pasted'), SOURCES[src], 'your text');
    render();
  }
  if (act === 'remove') { delete S.mine[t.dataset.vid]; save(); render(); }
  if (act === 'reset') {
    if (!S.resetArm) { S.resetArm = true; t.textContent = 'Click again to clear everything'; return; }
    S.mine = {}; S.log = []; S.venues = VENUES0.slice(); S.resetArm = false; S.toast = {msg:'All ratings cleared.'}; save(); render();
  }
  if (act === 'copy-tpl' || act === 'copy-portal') {
    const el = act === 'copy-tpl' ? $('#tpl') : $('#portalUrl');
    try { await navigator.clipboard.writeText(el.textContent); t.textContent = 'Copied'; }
    catch(err) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Selected, press copy'; }
  }
  if (act === 'kind') { S.kind = t.dataset.kind; render(); return; }
  if (act === 'rec-kind') { S.recKind = t.dataset.kind; render(); return; }
  if (act === 'match-kind') { S.matchKind = t.dataset.kind; S.cmpSel = null; render(); return; }
  if (act === 'rate-kind') { S.kind = t.dataset.kind; go('rate'); return; }
  if (act === 'map-kind') { S.mapKind = t.dataset.kind; render(); const g = GM.main; if (g && g.opts?.onIdle) onMapIdle('main'); return; }
  if (act === 'goto-offer') { S.getOpen = t.dataset.oid; go('offers'); return; }
  if (act === 'example') { EXAMPLE_PROFILE.forEach(([n,r]) => { const id = byName(n); if (id) (S.mine[id] ??= {}).example = r; }); S.toast = null; save(); render(); return; }
  if (act === 'maptoggle') { S.mapAll = !S.mapAll; render(); }
  if (act === 'to-auth') { S.authMode = 'signin'; S.authErr = S.authMsg = null; go('auth'); }
  if (act === 'auth-mode') { S.authMode = t.dataset.mode; S.authErr = S.authMsg = null; render(); }
  if (act === 'auth-cancel') { go(tabsFor()[0][0]); }
  if (act === 'demo-login') busy(t, async () => afterSignIn(await API.signIn(t.dataset.email, 'tastemate')));
  if (act === 'signout') busy(t, async () => { await API.signOut(); S.acct = null; S.mine = {}; S.vouchers = []; S.vdata = S.bal = S.admin = null; POOL = users; save(); await refreshAll(); go('rate'); });
  if (act === 'get-offer') { S.getOpen = t.dataset.oid; render(); document.getElementById('offer-' + t.dataset.oid)?.scrollIntoView({block:'center'}); return; }
  if (act === 'get-close') { S.getOpen = null; render(); return; }
  if (act === 'claim') busy(t, async () => {
    const mode = t.dataset.mode || 'free';
    const v = await API.claim(t.dataset.oid, mode);
    if (v.status === 'pending') {
      const res = await API.payVoucher(v.id);
      if (res?.url) { window.location.href = res.url; return; }
    }
    S.getOpen = null;
    S.toast = {msg: mode === 'ticket' ? `Ticket bought: <b class="num">${esc(v.code)}</b>. Show the QR code at the door. It's also in My vouchers.${API.demo ? ' Demo: no card was charged.' : ''}`
      : mode === 'secured' ? `Place secured: <b class="num">${esc(v.code)}</b>. The venue must honour it. It's also in My vouchers.${API.demo ? ' Demo: no card was charged.' : ''}`
      : `Claimed free: <b class="num">${esc(v.code)}</b>. Not guaranteed: it's honoured only if places are left when you arrive.`};
    await refreshAll(); render();
  });
  if (act === 'pay') busy(t, async () => {
    const res = await API.payVoucher(t.dataset.vid);
    if (res?.url) { window.location.href = res.url; return; }
    await refreshAll(); render();
  });
  if (act === 'fill-code') { $('#r-code').value = t.dataset.code; $('#r-bill').focus(); }
  if (act === 'account') { S.delArm = false; go('account'); }
  if (act === 'delete-account') {
    if (!S.delArm) { S.delArm = true; render(); return; }
    busy(t, async () => { await API.deleteAccount(); S.delArm = false; S.acct = null; S.mine = {}; S.vouchers = []; S.vdata = S.bal = S.admin = null; POOL = users; save(); await refreshAll(); S.tab = 'rate'; S.toast = {msg:'Your account has been deleted.'}; render(); });
  }
  if (act === 'scan-start') startScan();
  if (act === 'scan-stop') stopScan();
  if (act === 'end-offer') {
    if (S.endArm !== t.dataset.oid) { S.endArm = t.dataset.oid; render(); return; }
    busy(t, async () => { await API.endOffer(t.dataset.oid); S.endArm = null; S.toast = {msg:'Offer ended. Vouchers already claimed can still be used until the original end time.'}; await refreshAll(); render(); });
  }
  if (act === 'range') { S.statsRange = +t.dataset.n; render(); }
  if (act === 'qty') { $('#buy-qty').value = t.dataset.n; updateBuyPrice(); }
  if (act === 'approve') busy(t, async () => { await API.adminSetVendor(t.dataset.id, t.dataset.on === '1'); await refreshAll(); render(); });
  if (act === 'grant') busy(t, async () => { await API.adminGrant(t.dataset.id, 50); S.toast = {msg:'Added 50 tokens.'}; await refreshAll(); render(); });
});
const canLocate = () => !!navigator.geolocation && (NATIVE || !!CFG.BUILD);
if (canLocate()) $('#gpsBtn').hidden = false;
function useMyLocation(auto){
  const btn = $('#gpsBtn'); if (!auto) btn.textContent = 'Finding you…';
  navigator.geolocation.getCurrentPosition(pos => {
    LOCS.gps = {label:'My location', lat:pos.coords.latitude, lng:pos.coords.longitude};
    if (!$('#locSel option[value="gps"]')) $('#locSel').insertAdjacentHTML('afterbegin', '<option value="gps">My location</option>');
    S.locKey = 'gps'; S.sel = null; btn.textContent = 'Update my location';
    afterLocation();
  }, () => { btn.textContent = 'Use my location'; if (!auto) { S.toast = {err:true, msg:'Location is off for Tastemate. Allow it in your phone settings, or pick an area from the list.'}; render(); } }, {enableHighAccuracy:true, timeout:12000, maximumAge:120000});
}
// When the location changes: load what's around, then redraw
function afterLocation(){
  render();
  loadNearby(me(), 'all', 1500, () => render());
}
$('#gpsBtn').addEventListener('click', () => useMyLocation(false));
// In the Android app, open outside links (Google Maps, Tripadvisor, Yelp, Stripe) in the phone's own apps
document.addEventListener('click', e => {
  if (!NATIVE) return;
  const a = e.target.closest('a[target="_blank"]');
  if (a) { e.preventDefault(); window.location.href = a.href; }
}, true);
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-venue],g[data-cmp]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'locSel') { S.locKey = t.value; S.sel = null; save(); afterLocation(); return; }
  if (t.name === 'auth-role') { S.signupRole = t.value; const keep = {email:$('#auth-email')?.value, pw:$('#auth-password')?.value, name:$('#auth-name')?.value}; render(); if ($('#auth-email')) $('#auth-email').value = keep.email || ''; if ($('#auth-password')) $('#auth-password').value = keep.pw || ''; if ($('#auth-name')) $('#auth-name').value = keep.name || ''; return; }
  if (t.id === 'f-type') { const title = $('#f-title'); if (!title.dataset.edited) title.value = OFFER_DEFAULTS[t.value]; $('#priceFields').hidden = t.value !== 'ticket'; }
  if (t.matches('input[type=file][data-source]') && t.files.length) {
    const src = t.dataset.source; let all = [];
    try {
      for (const f of t.files) all = all.concat(await readFile(f));
      reportImport(mergeRecords(all, src, t.files[0].name), SOURCES[src], t.files[0].name);
    } catch(err) { S.toast = {err:true, msg:esc(err.message || 'That file could not be read.')}; }
    render();
  }
  if (t.closest('#offerForm')) updateOfferForm();
});
document.addEventListener('input', e => {
  if (e.target.id === 'rateSearch') { S.rateQ = e.target.value; S.liveIds = null; liveSearch(S.rateQ); const box = $('#searchResults'); if (box) box.innerHTML = searchResultsHtml(); }
  if (e.target.id === 'f-title') e.target.dataset.edited = '1';
  if (e.target.closest('#offerForm')) updateOfferForm();
  if (e.target.id === 'buy-qty') updateBuyPrice();
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const btn = f.querySelector('[type=submit]');
  if (f.id === 'placeSearch') { S.rateQ = $('#rateSearch').value; liveSearch(S.rateQ); const box = $('#searchResults'); if (box) box.innerHTML = searchResultsHtml(); return; }
  if (f.id === 'authForm') busy(btn, async () => {
    const m = f.dataset.mode, email = $('#auth-email')?.value.trim(), pw = $('#auth-password')?.value;
    S.authErr = S.authMsg = null;
    try {
      if (m === 'signin') return afterSignIn(await API.signIn(email, pw));
      if (m === 'signup') {
        const role = S.signupRole || 'user';
        if (!$('#auth-name').value.trim()) throw new Error('Enter your name.');
        if (role === 'vendor' && !$('#auth-business').value.trim()) throw new Error('Enter your business name.');
        const res = await API.signUp({email, password:pw, role, name:$('#auth-name').value.trim(), business:$('#auth-business')?.value.trim(), venue:$('#auth-venue')?.value});
        if (res?.confirm) { S.authMode = 'signin'; S.authMsg = `Almost there. We've emailed a confirmation link to <b>${esc(email)}</b>. Open it, then sign in here.`; render(); return; }
        return afterSignIn(res);
      }
      if (m === 'forgot') { await API.resetPassword(email); S.authMsg = `If ${esc(email)} has an account, a reset link is on its way.`; render(); return; }
      if (m === 'recovery') { if ((pw || '').length < 8) throw new Error('Use a password of at least 8 characters.'); await API.updatePassword(pw); S.authMode = 'signin'; return afterSignIn(await API.account()); }
    } catch(err) { S.authErr = cleanErr(err.message); render(); }
  });
  if (f.id === 'redeemForm') busy(btn, async () => {
    const code = $('#r-code').value, billTxt = $('#r-bill').value.trim(), partyTxt = $('#r-party').value.trim();
    const bill = billTxt ? Math.round(parseFloat(billTxt.replace(/[£,]/g, '')) * 100) : null, party = partyTxt ? parseInt(partyTxt, 10) : null;
    try {
      const data = await API.redeem(code, Number.isFinite(bill) ? bill : null, Number.isFinite(party) ? party : null);
      S.scanResult = {ok:true, data};
      S.vdata = await API.vendorData();
    } catch(err) { S.scanResult = {ok:false, msg:cleanErr(err.message)}; }
    render();
    if (!S.scanResult.ok) $('#r-code').value = code;
  });
  if (f.id === 'offerForm') busy(btn, async () => {
    const type = $('#f-type').value, toP = x => x === '' || x == null ? null : Math.round(parseFloat(x)*100);
    const o = await API.createOffer({title:$('#f-title').value, type, tokens:+$('#f-qty').value, hours:+$('#f-hours').value, radius:+$('#f-radius').value, minPred:+$('#f-min').value,
      price:type === 'ticket' ? toP($('#f-price').value) : null, was:type === 'ticket' ? toP($('#f-was').value) : null});
    await refreshAll();
    S.tab = 'v-home'; S.toast = {msg:`“${esc(o.title)}” is live for the first ${o.tokens} people who match. ${o.free_tokens} free and ${o.paid_tokens} bought tokens used.`}; render(); window.scrollTo({top:0});
  });
  if (f.id === 'buyForm') busy(btn, async () => {
    const qty = Math.floor(+$('#buy-qty').value || 0);
    const res = await API.checkout(qty);
    if (res.url) { window.location.href = res.url; return; }
    S.toast = {msg:`Added ${res.qty} tokens (${pounds(res.amount_pence)}). ${res.demo ? 'Demo: no card was charged.' : ''}`};
    await refreshAll(); render();
  });
});

/* ---------- Start ---------- */
S.booting = true; render();
(async () => {
  try { S.acct = await API.account(); } catch(e) { S.acct = null; }
  API.onRecovery(() => { S.authMode = 'recovery'; S.tab = 'auth'; render(); });
  if (location.hash === '#tokens-paid') { S.tab = 'v-tokens'; S.toast = {msg:'Payment received. Your tokens will appear in a few seconds.'}; setTimeout(async () => { await refreshAll(); render(); }, 4000); }
  if (location.hash === '#account') { S.tab = S.acct ? 'account' : 'auth'; S.authMsg = S.acct ? null : 'Sign in to manage or delete your account.'; }
  if (location.hash === '#voucher-paid') { S.tab = 'vouchers'; S.toast = {msg:'Payment received. Your voucher is ready below.'}; setTimeout(async () => { await refreshAll(); render(); }, 3000); }
  if (location.hash === '#voucher-cancelled') { S.tab = 'offers'; S.toast = {err:true, msg:'Payment cancelled. No money was taken, and the place you were holding is released after a few minutes.'}; }
  if (/#voucher-/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  if (location.hash === '#tokens-cancelled') { S.tab = 'v-tokens'; S.toast = {err:true, msg:'Payment cancelled. No money was taken.'}; }
  if (/#tokens-/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  if (S.acct?.role === 'user') await pullRatings().catch(() => {});
  await refreshAll();
  S.venues.forEach(v => { if (v.imported) { v.simDone = false; simulateFor(v); } });
  S.booting = false; render();
  if (NATIVE && canLocate()) useMyLocation(true); else loadNearby(me(), 'all', 1500, () => render());
})();
// Coming back to the app after paying in the browser: refresh vouchers and balances
document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.acct && !S.booting) { await refreshAll(); if (!['auth','v-offers','v-tokens','v-scan','reviews'].includes(S.tab)) render(); } });
setInterval(async () => { if (!document.hidden && !scanStream && !S.booting && !['auth','v-offers','v-tokens','v-scan','reviews'].includes(S.tab) && !document.activeElement?.matches('input,textarea,select')) { await refreshAll(); render(); } }, 60000);
})();
</script>
